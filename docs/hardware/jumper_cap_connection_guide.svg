<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
  <rect width="1800" height="1100" fill="#fff"/>
  <g fill="#000" stroke="#000" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
    <rect x="35" y="35" width="1730" height="1030" rx="24" fill="none" stroke-width="6"/>
    <text x="900" y="112" text-anchor="middle" font-size="58" font-weight="700" stroke="none">跳线帽连接说明（PCB 顶视图）</text>

    <rect x="80" y="155" width="1050" height="660" rx="22" fill="none" stroke-width="5"/>
    <text x="125" y="225" font-size="40" font-weight="700" stroke="none">信号选择：HPWR / HPWM1 / HPWM2</text>
    <text x="125" y="275" font-size="28" stroke="none">中心焊盘与目标 GPIO 之间装 1 个跳线帽（四选一）</text>

    <!-- Physical 3x3 selector footprint. The PCB screenshot has pin 3 at the top. -->
    <g transform="translate(220 295) scale(0.78)">
      <!-- NC corners -->
      <g fill="none" stroke-width="5">
        <circle cx="120" cy="80" r="40"/>
        <circle cx="520" cy="80" r="40"/>
        <circle cx="120" cy="480" r="40"/>
        <circle cx="520" cy="480" r="40"/>
        <path d="M95 55l50 50m0-50l-50 50M495 55l50 50m0-50l-50 50M95 455l50 50m0-50l-50 50M495 455l50 50m0-50l-50 50"/>
      </g>

      <!-- Selectable pads -->
      <g fill="#fff" stroke-width="7">
        <circle cx="320" cy="80" r="53"/>
        <circle cx="120" cy="280" r="53"/>
        <circle cx="520" cy="280" r="53"/>
        <circle cx="320" cy="480" r="53"/>
      </g>
      <circle cx="320" cy="280" r="57" fill="#000" stroke-width="7"/>
      <text x="320" y="294" text-anchor="middle" fill="#fff" font-size="36" font-weight="700" stroke="none">SIG</text>

      <!-- Direction arrows denote possible jumper positions, not simultaneous links. -->
      <g fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M320 205V145m0 0l-15 20m15-20l15 20"/>
        <path d="M245 280h-60m0 0l20-15m-20 15l20 15"/>
        <path d="M395 280h60m0 0l-20-15m20 15l-20 15"/>
        <path d="M320 355v60m0 0l-15-20m15 20l15-20"/>
      </g>

      <g font-size="31" font-weight="700" stroke="none">
        <text x="320" y="-2" text-anchor="middle">GPIO4（上）</text>
        <text x="45" y="291" text-anchor="end">GPIO1（左）</text>
        <text x="595" y="291">GPIO3（右）</text>
        <text x="320" y="570" text-anchor="middle">GPIO2（下）</text>
      </g>
      <text x="320" y="635" text-anchor="middle" font-size="25" stroke="none">四个角焊盘未连接（NC）</text>
    </g>

    <!-- Signal mapping table -->
    <g transform="translate(840 330)">
      <rect x="0" y="0" width="270" height="355" rx="18" fill="none" stroke-width="5"/>
      <text x="135" y="62" text-anchor="middle" font-size="35" font-weight="700" stroke="none">中心 SIG</text>
      <path d="M25 90h220M25 175h220M25 260h220" fill="none" stroke-width="4"/>
      <g font-size="29" stroke="none">
        <text x="135" y="140" text-anchor="middle">HPWR = EN5V</text>
        <text x="135" y="225" text-anchor="middle">HPWM1 = PWM1</text>
        <text x="135" y="310" text-anchor="middle">HPWM2 = PWM2</text>
      </g>
    </g>

    <!-- Power selector -->
    <rect x="1170" y="155" width="550" height="660" rx="22" fill="none" stroke-width="5"/>
    <text x="1445" y="225" text-anchor="middle" font-size="40" font-weight="700" stroke="none">PWR 选择</text>
    <text x="1445" y="270" text-anchor="middle" font-size="27" stroke="none">从左到右：1 / 2 / 3</text>

    <g transform="translate(1225 330)">
      <text x="220" y="0" text-anchor="middle" font-size="34" font-weight="700" stroke="none">选择 5V：短接 1-2</text>
      <rect x="46" y="45" width="268" height="126" rx="48" fill="none" stroke-width="9"/>
      <g fill="#fff" stroke-width="7">
        <circle cx="120" cy="108" r="42"/>
        <circle cx="240" cy="108" r="42"/>
        <circle cx="360" cy="108" r="42"/>
      </g>
      <g font-size="26" font-weight="700" stroke="none">
        <text x="120" y="118" text-anchor="middle">1</text>
        <text x="240" y="118" text-anchor="middle">2</text>
        <text x="360" y="118" text-anchor="middle">3</text>
      </g>

      <path d="M20 220h400" fill="none" stroke-width="4"/>
      <text x="220" y="285" text-anchor="middle" font-size="34" font-weight="700" stroke="none">选择 3V3：短接 2-3</text>
      <rect x="166" y="330" width="268" height="126" rx="48" fill="none" stroke-width="9"/>
      <g fill="#fff" stroke-width="7">
        <circle cx="120" cy="393" r="42"/>
        <circle cx="240" cy="393" r="42"/>
        <circle cx="360" cy="393" r="42"/>
      </g>
      <g font-size="26" font-weight="700" stroke="none">
        <text x="120" y="403" text-anchor="middle">1</text>
        <text x="240" y="403" text-anchor="middle">2</text>
        <text x="360" y="403" text-anchor="middle">3</text>
      </g>
    </g>

    <rect x="80" y="850" width="1640" height="160" rx="22" fill="none" stroke-width="5"/>
    <text x="900" y="920" text-anchor="middle" font-size="36" font-weight="700" stroke="none">注意：每个选择器只装 1 个跳线帽</text>
    <text x="900" y="972" text-anchor="middle" font-size="31" stroke="none">不要同时短接多个 GPIO；图中上下左右方向与所给 PCB 截图一致</text>
  </g>
</svg>
